                        (item.category && item.category.toLowerCase().includes(searchLower));

                    return matchesStatus && matchesCategory && matchesSearch;
                });

                    if (sortOption === "code_asc") return (a.code || "").localeCompare(b.code || "", undefined, { numeric: true });

                                batch.set(docRef, item);
                            });
                            await batch.commit();
                        }

                                                return (
                                                    <tr 
                                                        key={item.id} 
                                                        className="hover:bg-slate-50/80 transition-colors group"
                                                    >
                                                        {/* Código */}
                                                        <td className="py-3.5 px-6 whitespace-nowrap">
                                                            <button 
                                                                onClick={() => copyToClipboard(item.code)}
                                                                className="px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-mono font-bold rounded-lg border border-slate-200/80 text-xs flex items-center gap-1.5 transition-all"
                                                                title="Clique para copiar o código"
                                                            >
                                                                <span>{item.code}</span>
                                                                <Icon name="copy" className="w-3 h-3 text-slate-400 group-hover:text-slate-600" />
                                                            </button>
                                                        </td>

                                                        {/* Categoria */}
                                                        <td className="py-3.5 px-6 whitespace-nowrap">
                                                            {!item.active ? (
                                                                <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold bg-rose-100 text-rose-700 border border-rose-200">
                                                                    <span className="w-2 h-2 rounded-full bg-rose-500"></span>
                                                                    DESMOBILIZADO
                                                                </span>
                                                            ) : (
                                                                <span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-bold border ${style.bg} ${style.text} ${style.border}`}>
                                                                    <span className={`w-2 h-2 rounded-full ${style.dot}`}></span>
                                                                    {item.category}
                                                                </span>
                                                            )}
                                                        </td>

                                                        {/* Nome & Descrição */}
                                                        <td className="py-3.5 px-6 text-slate-700 font-semibold">
                                                            <div className="flex flex-col">
                                                                <span className="text-slate-900 font-bold">{item.name}</span>
                                                                <span className="text-slate-500 font-normal text-xs mt-0.5">{item.desc}</span>
                                                            </div>
                                                        </td>

                                                        {/* Ações Diretas */}
                                                        <td className="py-3.5 px-6 text-center whitespace-nowrap no-print">
                                                            <div className="flex items-center justify-center gap-1.5">
                                                                {/* Botão Editar Direto na Linha */}
                                                                <button 
                                                                    onClick={() => startInlineEdit(item)}
                                                                    className="p-1.5 bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white rounded-lg transition-all border border-blue-200"
                                                                    title="Editar direto na tabela"
                                                                >
                                                                    <Icon name="pencil" className="w-3.5 h-3.5" />
                                                                </button>

                                                                {/* Desativar / Reativar */}
                                                                <button 
                                                                    onClick={() => toggleStatus(item.id)}
                                                                    className={`p-1.5 rounded-lg transition-all border ${
                                                                        item.active 
                                                                            ? 'bg-amber-50 text-amber-700 hover:bg-amber-600 hover:text-white border-amber-200' 
                                                                            : 'bg-emerald-50 text-emerald-700 hover:bg-emerald-600 hover:text-white border-emerald-200'
                                                                    }`}
                                                                    title={item.active ? "Mover para Desmobilizados" : "Reativar conta"}
                                                                >
                                                                    <Icon name={item.active ? "power" : "rotate-ccw"} className="w-3.5 h-3.5" />
                                                                </button>

                                                                {/* Excluir com confirmação */}
                                                                <button 
                                                                    onClick={() => {
                                                                        requireAdmin(() => {
                                                                            if (confirm(`Excluir permanentemente a conta ${item.code} - ${item.name}?`)) {
                                                                                deleteItem(item.id);
                                                                            }
                                                                        });
                                                                    }}
                                                                    className="p-1.5 bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white rounded-lg transition-all border border-rose-200"
                                                                    title="Excluir da lista"
                                                                >
                                                                    <Icon name="trash-2" className="w-3.5 h-3.5" />
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        ) : (
                                            <tr>
                                                <td colSpan="4" className="py-16 text-center">
                                                    <Icon name="search-x" className="w-12 h-12 mx-auto text-slate-300 mb-3 stroke-1" />
                                                    <h3 className="text-lg font-bold text-slate-700">Nenhum plano de conta encontrado</h3>
                                                    <p className="text-slate-400 text-sm mt-1 max-w-md mx-auto">
                                                        Tente ajustar a sua busca ou clique no botão "+ Adicionar Conta" para criar um novo registo.
                                                    </p>
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    {/* Modal de Solicitacao de Palavra-passe */}
                    {isAuthModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full overflow-hidden">
                                <div className="p-6 bg-[#0f172a] text-white flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="p-2 bg-purple-500/20 text-purple-400 rounded-xl border border-purple-500/30">
                                            <Icon name="lock" className="w-5 h-5" />
                                        </div>
                                        <div>
                                            <h3 className="font-bold text-base">Autenticação Requerida</h3>
                                            <p className="text-slate-400 text-xs">Digite a palavra-passe para permitir alterações</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setIsAuthModalOpen(false)}
                                        className="text-slate-400 hover:text-white p-1 rounded-lg hover:bg-slate-800 transition-colors"
                                    >
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>
                                <form onSubmit={handleLogin} className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">
                                            Palavra-passe de Administrador
                                        </label>
                                        <input 
                                            type="password"
                                            required
                                            autoFocus
                                            placeholder="Digite a palavra-passe..."
                                            value={inputPassword}
                                            onChange={(e) => setInputPassword(e.target.value)}
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-purple-600 focus:bg-white outline-none"
                                        />
                                        <p className="text-[11px] text-slate-400 mt-1.5">
                                            * Palavra-passe de acesso: <code className="bg-slate-100 text-slate-700 px-1 py-0.5 rounded font-mono">chb2026</code>
                                        </p>
                                    </div>

                                    {authError && (
                                        <div className="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs font-semibold flex items-center gap-2">
                                            <Icon name="alert-circle" className="w-4 h-4 text-rose-500 shrink-0" />
                                            {authError}
                                        </div>
                                    )}

                                    <div className="pt-2 flex items-center justify-end gap-2.5">
                                        <button 
                                            type="button"
                                            onClick={() => setIsAuthModalOpen(false)}
                                            className="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition-colors"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2.5 text-xs font-bold bg-purple-600 hover:bg-purple-700 text-white rounded-xl shadow-xs transition-colors flex items-center gap-2"
                                        >
                                            <Icon name="key" className="w-3.5 h-3.5" />
                                            Desbloquear Edição
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Copied Toast Notification */}
                    {copiedCode && (
                        <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 z-50 border border-slate-700 animate-bounce">
                            <Icon name="check" className="w-4 h-4 text-emerald-400" />
                            Código <strong>{copiedCode}</strong> copiado com sucesso!
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
